services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/kanban}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars) in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      - mongodb
  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  frontend:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
volumes:
  mongo_data:
